name: CI

on:
  workflow_dispatch:
    inputs:
      rolldown_preview:
        description: 'Package spec for the "rolldown preview" rows, for example https://pkg.pr.new/rolldown/rolldown@<sha>. Empty keeps the lockfile version.'
        required: false
        default: ''
      extra_env:
        description: 'Space-separated NAME=value pairs that all benchmark steps get, for example SKIP_EXPORTS_KEY_CHECK=1.'
        required: false
        default: ''
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Collect system information
        uses: kenchan0130/actions-system-info@ceae9371bdbf9ff80acc78f28f7824a39c9648b3 # v1.5.0
        id: system-info

      - name: Print system information
        run: |
          echo "::group::System Information"
          echo "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
          echo "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
          echo "Hostname: ${{ steps.system-info.outputs.hostname }}"
          echo "Kernel Release: ${{ steps.system-info.outputs.kernel-release }}"
          echo "Kernel Version: ${{ steps.system-info.outputs.kernel-version }}"
          echo "OS Name: ${{ steps.system-info.outputs.name }}"
          echo "Platform: ${{ steps.system-info.outputs.platform }}"
          echo "OS Release: ${{ steps.system-info.outputs.release }}"
          echo "Total Memory: ${{ steps.system-info.outputs.totalmem }}"
          echo "::endgroup::"

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install hyperfine
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: hyperfine

      - name: Export extra env
        if: inputs.extra_env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          for pair in $EXTRA_ENV; do
            echo "$pair" | tee -a "$GITHUB_ENV"
          done

      - name: Use another rolldown preview
        if: inputs.rolldown_preview != ''
        env:
          SPEC: ${{ inputs.rolldown_preview }}
        run: pnpm --filter rolldown-preview add "$SPEC" --ignore-scripts

      - name: Test Rolldown build
        working-directory: apps/10000
        run: |
          node --run build:rolldown
          ls -lh dist-rolldown

      - name: Test Rolldown preview build
        working-directory: apps/10000
        run: |
          node --run build:rolldown-preview
          node --run build:rolldown-preview-cold
          ROLLDOWN_FS_TIMES=1 node --run build:rolldown-preview-cache
          ROLLDOWN_FS_TIMES=1 node --run build:rolldown-preview-cache
          ls -lh dist-rolldown-preview dist-rolldown-preview-cache
          cmp dist-rolldown-preview/main.js dist-rolldown-preview-cache/main.js
          cmp dist-rolldown-preview/main.js dist-rolldown-preview-cold/main.js

      - name: Test Bun build
        working-directory: apps/10000
        run: |
          node --run build:bun
          ls -lh dist-bun

      - name: Run benchmark
        run: node bench.mjs --app apps/10000 > benchmark-output.txt

      - name: Write summary
        env:
          SPEC: ${{ inputs.rolldown_preview }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            if [ -n "$SPEC" ]; then echo "rolldown preview: \`$SPEC\`"; echo; fi
            if [ -n "$EXTRA_ENV" ]; then echo "extra env: \`$EXTRA_ENV\`"; echo; fi
            sed -n '/^| Tool/,$p' benchmark-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-output.txt

  update-readme:
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download all benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./results

      - name: Update README
        env:
          SPEC: ${{ inputs.rolldown_preview }}
          EXTRA_ENV: ${{ inputs.extra_env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/update-readme.mjs

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: |-
            chore: update benchmark results in README [skip ci]

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          file_pattern: README.md
